<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סופר שלזי</title>
<meta name="description" content="רשימת קניות משפחתית משותפת">
<meta name="theme-color" content="#1f9d63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סופר שלזי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">🛒</span><h1 id="title">סופר שלזי</h1></div>
    <button id="syncDot" class="sync" aria-label="מצב סנכרון" title="מצב סנכרון"></button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs">
    <button data-view="list"><span>📝</span>רשימה</button>
    <button data-view="trip"><span>🧾</span>חשבונית</button>
    <button data-act="scan" class="scan-tab"><span>📷</span>סריקה</button>
    <button data-view="history"><span>🕘</span>היסטוריה</button>
    <button data-view="settings"><span>⚙️</span>הגדרות</button>
  </nav>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>
<noscript>האפליקציה דורשת JavaScript.</noscript>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
